name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: apt-get update -y && apt-get install -y git debhelper
      - name: Empacotar .deb
        run: |
          cp -r packaging/debian debian
          dpkg-buildpackage -b -us -uc
          cp ../waydroid-binds_*.deb "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: waydroid-binds_*.deb

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: dnf install -y rpm-build python3
      - name: Empacotar .rpm
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          tar -czf ~/rpmbuild/SOURCES/waydroid-binds-1.3.0.tar.gz \
            --transform 's,^,waydroid-binds-1.3.0/,' \
            --exclude='*/__pycache__/*' \
            setup-waydroid-binds.sh setup-waydroid-firewall.sh \
            revert-waydroid-binds.sh copy-existing-media.sh \
            waydroid-binds-gui gui LICENSE
          rpmbuild -bb packaging/rpm/waydroid-binds.spec
          cp ~/rpmbuild/RPMS/noarch/waydroid-binds-*.rpm "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: waydroid-binds-*.rpm

  pacman:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel fakeroot
      - name: Empacotar (makepkg)
        run: |
          mkdir -p /work
          tar -czf /work/waydroid-binds-${{ github.ref_name }}.tar.gz \
            --transform 's,^,waydroid-binds-${{ github.ref_name }}/,' \
            --exclude='*/__pycache__/*' \
            setup-waydroid-binds.sh setup-waydroid-firewall.sh \
            revert-waydroid-binds.sh copy-existing-media.sh \
            waydroid-binds-gui gui LICENSE
          cp packaging/arch/PKGBUILD /work/PKGBUILD
          useradd -m builder
          chown -R builder /work
          su builder -c 'cd /work && makepkg -f --nodeps --noconfirm'
          cp /work/*.pkg.tar.zst "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: pacman
          path: '*.pkg.tar.zst'

  aur:
    runs-on: ubuntu-latest
    needs: [pacman]
    if: startsWith(github.ref, 'refs/tags/') && env.AUR_SSH_PRIVATE_KEY != ''
    permissions:
      contents: read
    env:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular sha256 do tarball
        id: sha256
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          URL="https://github.com/isaacangello/WaydroidBinds/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA256=$(curl -sL "$URL" | sha256sum | cut -d' ' -f1)
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Atualizar PKGBUILD
        run: |
          cd packaging/arch
          sed -i "s/^pkgver=.*/pkgver=${{ steps.sha256.outputs.tag }}/" PKGBUILD
          sed -i "s/^sha256sums=.*/sha256sums=('${{ steps.sha256.outputs.sha256 }}')/" PKGBUILD
          cat PKGBUILD
      - name: Gerar .SRCINFO
        run: |
          cd packaging/arch
          makepkg --printsrcinfo > .SRCINFO
          cat .SRCINFO
      - name: Publicar no AUR (via aurpublish)
        run: |
          cd packaging/arch
          eval "$(ssh-agent -s)"
          echo "$AUR_SSH_PRIVATE_KEY" | ssh-add -
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          aurpublish --no-verify

  release:
    runs-on: ubuntu-latest
    needs: [deb, rpm, pacman]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*/* \
            --title "Waydroid Binds $GITHUB_REF_NAME" --generate-notes
