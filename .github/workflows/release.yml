name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  deb:
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: apt-get update -y && apt-get install -y git debhelper
      - name: Empacotar .deb
        run: |
          cp -r packaging/debian debian
          dpkg-buildpackage -b -us -uc
          cp ../waydroid-binds_*.deb "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: waydroid-binds_*.deb

  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: dnf install -y rpm-build python3
      - name: Empacotar .rpm
        run: |
          mkdir -p ~/rpmbuild/SOURCES
          tar -czf ~/rpmbuild/SOURCES/waydroid-binds-1.3.0.tar.gz \
            --transform 's,^,waydroid-binds-1.3.0/,' \
            --exclude='*/__pycache__/*' \
            setup-waydroid-binds.sh setup-waydroid-firewall.sh \
            revert-waydroid-binds.sh copy-existing-media.sh \
            waydroid-binds-gui gui
          rpmbuild -bb packaging/rpm/waydroid-binds.spec
          cp ~/rpmbuild/RPMS/noarch/waydroid-binds-*.rpm "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: waydroid-binds-*.rpm

  pacman:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar dependências
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed base-devel fakeroot
      - name: Empacotar (makepkg)
        run: |
          mkdir -p /work
          tar -czf /work/waydroid-binds-1.3.0.tar.gz \
            --transform 's,^,waydroid-binds-1.3.0/,' \
            --exclude='*/__pycache__/*' \
            setup-waydroid-binds.sh setup-waydroid-firewall.sh \
            revert-waydroid-binds.sh copy-existing-media.sh \
            waydroid-binds-gui gui
          cp packaging/arch/PKGBUILD /work/PKGBUILD
          useradd -m builder
          chown -R builder /work
          su builder -c 'cd /work && makepkg -f --noconfirm'
          cp /work/*.pkg.tar.zst "$GITHUB_WORKSPACE/"
      - uses: actions/upload-artifact@v4
        with:
          name: pacman
          path: '*.pkg.tar.zst'

  flatpak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar flatpak-builder
        run: |
          sudo apt-get update -y
          sudo apt-get install -y flatpak flatpak-builder
      - name: Baixar runtime KDE
        run: |
          flatpak remote-add --if-not-exists --user flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y org.kde.Platform//6.8 org.kde.Sdk//6.8
      - name: Build
        run: flatpak-builder --user --force-clean --repo=repo build packaging/flatpak/org.waydroidbinds.WaydroidBinds.yml
      - name: Bundle
        run: flatpak build-bundle repo waydroid-binds.flatpak org.waydroidbinds.WaydroidBinds
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: waydroid-binds.flatpak

  release:
    runs-on: ubuntu-latest
    needs: [deb, rpm, pacman, flatpak]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Criar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/*/* \
            --title "Waydroid Binds $GITHUB_REF_NAME" --generate-notes
